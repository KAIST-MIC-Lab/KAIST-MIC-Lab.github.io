<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Neuro-adaptive control concept</title>
  <desc id="desc">A neural policy produces a raw control for an uncertain plant, an input-constraint layer determines the applied input, and closed-loop error drives a projected parameter-adaptation path.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FED"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9485F"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F9B8E"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7657C8"/>
    </marker>
  </defs>

  <rect width="1600" height="800" rx="32" fill="#F7F9FC"/>
  <text x="65" y="70" fill="#17243C" font-family="Arial, 'Noto Sans', sans-serif" font-size="46" font-weight="700">NEURO-ADAPTIVE CONTROL</text>
  <text x="67" y="114" fill="#607089" font-family="Arial, 'Noto Sans', sans-serif" font-size="22" font-weight="600">APPROXIMATE IDEAL LAW  →  ADAPT ONLINE  →  CONSTRAIN PARAMETERS &amp; INPUTS</text>

  <rect x="55" y="250" width="240" height="150" rx="21" fill="#E8F7F5" stroke="#0F9B8E" stroke-width="3"/>
  <text x="175" y="302" text-anchor="middle" fill="#0F9B8E" font-family="Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="700">REFERENCE +</text>
  <text x="175" y="338" text-anchor="middle" fill="#0F9B8E" font-family="Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="700">MEASUREMENT</text>
  <text x="175" y="375" text-anchor="middle" fill="#607089" font-family="Arial, 'Noto Sans', sans-serif" font-size="18">closed-loop information</text>

  <rect x="345" y="250" width="220" height="150" rx="21" fill="#E8F7F5" stroke="#0F9B8E" stroke-width="3"/>
  <text x="455" y="315" text-anchor="middle" fill="#0F9B8E" font-family="Arial, 'Noto Sans', sans-serif" font-size="29" font-weight="700">REGRESSOR</text>
  <text x="455" y="365" text-anchor="middle" fill="#17243C" font-family="Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="600">ξₖ</text>

  <rect x="615" y="225" width="280" height="200" rx="23" fill="#F2EEFC" stroke="#7657C8" stroke-width="4"/>
  <text x="755" y="287" text-anchor="middle" fill="#7657C8" font-family="Arial, 'Noto Sans', sans-serif" font-size="30" font-weight="700">NEURAL POLICY</text>
  <text x="755" y="337" text-anchor="middle" fill="#17243C" font-family="Arial, 'Noto Sans', sans-serif" font-size="25" font-weight="600">μ<tspan baseline-shift="sub" font-size="18">φₜ</tspan><tspan baseline-shift="baseline">(ξₖ)</tspan></text>
  <text x="755" y="380" text-anchor="middle" fill="#607089" font-family="Arial, 'Noto Sans', sans-serif" font-size="18">full law or residual correction</text>

  <rect x="945" y="250" width="260" height="150" rx="21" fill="#ECF2FE" stroke="#2F6FED" stroke-width="3"/>
  <text x="1075" y="303" text-anchor="middle" fill="#2F6FED" font-family="Arial, 'Noto Sans', sans-serif" font-size="23" font-weight="700">INPUT-CONSTRAINT</text>
  <text x="1075" y="339" text-anchor="middle" fill="#2F6FED" font-family="Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="700">LAYER</text>
  <text x="1075" y="375" text-anchor="middle" fill="#17243C" font-family="Arial, 'Noto Sans', sans-serif" font-size="20">raw → admissible uₖ</text>

  <rect x="1260" y="225" width="285" height="200" rx="23" fill="#FDECEF" stroke="#D9485F" stroke-width="4"/>
  <text x="1402" y="290" text-anchor="middle" fill="#D9485F" font-family="Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="700">UNCERTAIN PLANT</text>
  <text x="1402" y="340" text-anchor="middle" fill="#17243C" font-family="Arial, 'Noto Sans', sans-serif" font-size="23" font-weight="600">apply  uₖ</text>
  <text x="1402" y="382" text-anchor="middle" fill="#607089" font-family="Arial, 'Noto Sans', sans-serif" font-size="18">observe state / output</text>

  <rect x="300" y="575" width="300" height="135" rx="21" fill="#FDECEF" stroke="#D9485F" stroke-width="3"/>
  <text x="450" y="626" text-anchor="middle" fill="#D9485F" font-family="Arial, 'Noto Sans', sans-serif" font-size="24" font-weight="700">CLOSED-LOOP ERROR</text>
  <text x="450" y="670" text-anchor="middle" fill="#607089" font-family="Arial, 'Noto Sans', sans-serif" font-size="19">tracking · regulation · residual</text>

  <rect x="660" y="555" width="290" height="175" rx="22" fill="#F2EEFC" stroke="#7657C8" stroke-width="3"/>
  <text x="805" y="612" text-anchor="middle" fill="#7657C8" font-family="Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="700">ADAPTATION LAW</text>
  <text x="805" y="657" text-anchor="middle" fill="#17243C" font-family="Arial, 'Noto Sans', sans-serif" font-size="24" font-weight="600">Δφₜ</text>
  <text x="805" y="696" text-anchor="middle" fill="#607089" font-family="Arial, 'Noto Sans', sans-serif" font-size="18">closed-loop-derived update</text>

  <rect x="1010" y="555" width="290" height="175" rx="22" fill="#F2EEFC" stroke="#7657C8" stroke-width="3"/>
  <text x="1155" y="612" text-anchor="middle" fill="#7657C8" font-family="Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="700">PARAMETER</text>
  <text x="1155" y="647" text-anchor="middle" fill="#7657C8" font-family="Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="700">PROJECTION</text>
  <text x="1155" y="692" text-anchor="middle" fill="#17243C" font-family="Arial, 'Noto Sans', sans-serif" font-size="21">project to 𝓡<tspan baseline-shift="sub" font-size="15">adm</tspan></text>

  <path d="M 295 325 L 345 325" fill="none" stroke="#0F9B8E" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M 565 325 L 615 325" fill="none" stroke="#0F9B8E" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M 895 325 L 945 325" fill="none" stroke="#7657C8" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="920" y="304" text-anchor="middle" fill="#7657C8" font-family="Arial, 'Noto Sans', sans-serif" font-size="17" font-weight="700">uₖ (raw)</text>
  <path d="M 1205 325 L 1260 325" fill="none" stroke="#2F6FED" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1232" y="304" text-anchor="middle" fill="#2F6FED" font-family="Arial, 'Noto Sans', sans-serif" font-size="17" font-weight="700">uₖ</text>

  <path d="M 1402 425 L 1402 500 L 450 500 L 450 575" fill="none" stroke="#D9485F" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="930" y="526" text-anchor="middle" fill="#D9485F" font-family="Arial, 'Noto Sans', sans-serif" font-size="18" font-weight="700">measurement feedback</text>
  <circle cx="1155" cy="500" r="10" fill="#F7F9FC"/>

  <path d="M 600 642 L 660 642" fill="none" stroke="#7657C8" stroke-width="5" stroke-dasharray="11 9" marker-end="url(#arrow-purple)"/>
  <path d="M 950 642 L 1010 642" fill="none" stroke="#7657C8" stroke-width="5" stroke-dasharray="11 9" marker-end="url(#arrow-purple)"/>
  <path d="M 1155 555 L 1155 475 L 755 475 L 755 425" fill="none" stroke="#7657C8" stroke-width="5" stroke-dasharray="11 9" marker-end="url(#arrow-purple)"/>
  <text x="960" y="466" text-anchor="middle" fill="#7657C8" font-family="Arial, 'Noto Sans', sans-serif" font-size="18" font-weight="700">projected parameters at  t+1</text>

</svg>
